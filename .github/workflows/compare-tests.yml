name: Test Instagram export comparison
on:
  push:
    branches:
      - not-following-back
  pull_request:
    paths:
      - compare.js
      - tests/**
      - .github/workflows/compare-tests.yml
jobs:
  compare-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run parser tests
        run: node --test tests/compare.test.js
